# Діагностика сервера: чи відповідає і які помилки за останні години (без особистих даних)
name: Діагностика сервера
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diag.yml', '.github/diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Вхід поза Telegram (auth/start)
        run: |
          for H in https://yl-mini-app.vova-younglife.workers.dev https://myyl-api.pages.dev; do
            echo "== $H"
            curl -s -m 20 -w "\nHTTP %{http_code} за %{time_total}s\n" -X POST "$H/auth/start" -H 'Origin: https://vovayounglife.github.io' --data '{}' | sed -E 's/[a-f0-9]{40}/<nonce>/g'
            curl -s -m 20 -D - -o /dev/null -X OPTIONS "$H/auth/start" -H 'Origin: https://vovayounglife.github.io' -H 'Access-Control-Request-Method: POST' | grep -iE '^HTTP|access-control'
          done
      - name: Збої на телефонах (останні)
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          curl -s -X POST https://yl-mini-app.vova-younglife.workers.dev/admin/clog -H "x-sync-key: $SYNC_KEY" | jq -c '.rows[] | (.data | fromjson? // {raw: .}) as $d | {ts, a: $d.a, try: $d.try, host: $d.host, err: $d.err, st: $d.st, ct: $d.ct, len: $d.len, bytes: $d.bytes, v: $d.v, tg: $d.tg, on: $d.on, ua: $d.ua, html: (if ($d.head // "" | startswith("<")) then $d.head else null end)}' | head -40
      - name: Запити від імені «Раб Божий» (час, розмір, помилки)
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          Q='{"q":[{"action":"me"},{"action":"stats","data":{"units":[],"cat":"overview","period":"month"}},{"action":"stats","data":{"units":["nat"],"cat":"overview","period":"month"}},{"action":"stats","data":{"units":["nat"],"cat":"club","period":"year"}},{"action":"stats","data":{"units":["nat"],"cat":"people","period":"month"}},{"action":"stats","data":{"units":["nat"],"cat":"known","period":"month"}},{"action":"stats","data":{"units":["nat"],"cat":"finance","period":"month"}},{"action":"dirStats","data":{"units":["nat"],"period":"month"}},{"action":"knownList","data":{"mine":true}},{"action":"events"}]}'
          curl -s -X POST https://yl-mini-app.vova-younglife.workers.dev/admin/probe -H "x-sync-key: $SYNC_KEY" -H 'content-type: application/json' --data "$Q" | jq -c '.out[]? // .'
      - name: З України (Globalping)
        continue-on-error: true
        run: bash .github/diag/ua.sh
      - name: Справжній застосунок у браузері
        continue-on-error: true
        run: |
          cd .github/diag && npm init -y >/dev/null && npm i puppeteer@23 >/dev/null 2>&1 && node probe.mjs
      - name: Запит до сервера
        run: |
          for i in 1 2 3; do
            curl -s -o body.txt -w "HTTP %{http_code} за %{time_total}s\n" -X POST https://yl-mini-app.vova-younglife.workers.dev -H 'content-type: application/json' --data '{"action":"me","data":{},"initData":""}'
            head -c 300 body.txt; echo
          done
          curl -s -o /dev/null -w "OPTIONS %{http_code}\n" -X OPTIONS https://yl-mini-app.vova-younglife.workers.dev
      - name: Telegram → сервер (вебхук)
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -s "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo" | jq '.result | {url: (.url|sub("[?].*";"")), pending_update_count, last_error_date, last_error_message, ip_address}'
      - name: З України та Європи (check-host.net)
        continue-on-error: true
        run: |
          U=https://yl-mini-app.vova-younglife.workers.dev/
          R=$(curl -s -H 'Accept: application/json' "https://check-host.net/check-http?host=$U&max_nodes=40")
          ID=$(echo "$R" | jq -r .request_id); echo "nodes: $(echo "$R" | jq -c '[.nodes|to_entries[]|.value[1]]')"
          sleep 25
          curl -s -H 'Accept: application/json' "https://check-host.net/check-result/$ID" | jq -c 'to_entries[] | {node:.key, r:.value}' | grep -iE 'ua|pl|de|ro|md|sk|cz|hu|lt|nl' | head -30
          R=$(curl -s -H 'Accept: application/json' "https://check-host.net/check-tcp?host=yl-mini-app.vova-younglife.workers.dev:443&max_nodes=40")
          ID=$(echo "$R" | jq -r .request_id); sleep 20
          echo TCP; curl -s -H 'Accept: application/json' "https://check-host.net/check-result/$ID" | jq -c 'to_entries[] | {node:.key, r:.value}' | grep -iE 'ua|pl|de|ro|md' | head -20
          echo GHPAGES; R=$(curl -s -H 'Accept: application/json' "https://check-host.net/check-http?host=https://vovayounglife.github.io/MyYL-mini-app/&max_nodes=40"); ID=$(echo "$R" | jq -r .request_id); sleep 20
          curl -s -H 'Accept: application/json' "https://check-host.net/check-result/$ID" | jq -c 'to_entries[] | {node:.key, r:.value}' | grep -iE 'ua' | head -10
      - name: Помилки воркера за 24 год (Cloudflare)
        run: |
          SINCE=$(date -u -d '-24 hours' +%Y-%m-%dT%H:%M:%SZ); NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          Q=$(jq -n --arg acc "$CF_ACC" --arg s "$SINCE" --arg n "$NOW" '{query: "query($acc:String!,$s:Time!,$n:Time!){viewer{accounts(filter:{accountTag:$acc}){workersInvocationsAdaptive(limit:200,filter:{datetime_geq:$s,datetime_leq:$n,scriptName:\"yl-mini-app\"},orderBy:[datetimeHour_DESC]){sum{requests errors subrequests}quantiles{cpuTimeP50 cpuTimeP99}dimensions{datetimeHour status}}}}}", variables:{acc:$acc,s:$s,n:$n}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' --data "$Q" | jq -c '.errors // (.data.viewer.accounts[0].workersInvocationsAdaptive[] | {h:.dimensions.datetimeHour,st:.dimensions.status,req:.sum.requests,err:.sum.errors,cpu50:.quantiles.cpuTimeP50,cpu99:.quantiles.cpuTimeP99})' | head -60
          Q2=$(jq -n --arg acc "$CF_ACC" --arg s "$SINCE" --arg n "$NOW" '{query: "query($acc:String!,$s:Time!,$n:Time!){viewer{accounts(filter:{accountTag:$acc}){d1AnalyticsAdaptiveGroups(limit:50,filter:{datetime_geq:$s,datetime_leq:$n}){sum{readQueries writeQueries rowsRead rowsWritten}dimensions{datetimeHour}}}}}", variables:{acc:$acc,s:$s,n:$n}}')
          curl -s https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CF_TOKEN" -H 'content-type: application/json' --data "$Q2" | jq -c '.errors // (.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[] | {h:.dimensions.datetimeHour,r:.sum.readQueries,w:.sum.writeQueries,rowsRead:.sum.rowsRead,rowsWritten:.sum.rowsWritten})' | head -40

# Автоматичне викладання бекенду на Cloudflare після кожної зміни в папці worker/
name: Сервер (Cloudflare)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SYNC_KEY: ${{ secrets.SYNC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тести
        run: npm test

      - name: Перевірка секретів
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN SYNC_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Не задано секрет $s (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: Встановити wrangler
        run: npm i -g wrangler@4

      - name: База D1
        run: |
          ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="yl-db") | .uuid')
          if [ -z "$ID" ]; then
            wrangler d1 create yl-db
            ID=$(wrangler d1 list --json | jq -r '.[] | select(.name=="yl-db") | .uuid')
          fi
          echo "D1: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          wrangler d1 execute yl-db --remote --file=schema.sql
          # зміни до наявних таблиць; повторний запуск (колонка вже є) — не помилка
          for f in migrations/*.sql; do
            [ -e "$f" ] || continue
            wrangler d1 execute yl-db --remote --file="$f" 2>&1 | tee mig.log || true
            if grep -qiE "error" mig.log && ! grep -qiE "duplicate column" mig.log; then echo "::warning::Міграція $f: перевір лог"; fi
          done

      - name: Викласти
        id: deploy
        run: |
          wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -o 'https://[a-zA-Z0-9.-]*\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Секрети
        run: |
          printf '%s' "$BOT_TOKEN" | wrangler secret put BOT_TOKEN
          printf '%s' "$SYNC_KEY" | wrangler secret put SYNC_KEY

      - name: Підключити бота
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 5
          RES=$(curl -s -X POST "$URL/admin/setup" -H "x-sync-key: $SYNC_KEY")
          echo "$RES" | jq '{ok, bot, api, webhook}'
          {
            echo "### ✅ Сервер працює"
            echo ""
            echo "Адреса сервера: **$URL**"
            echo ""
            echo "Бот: @$(echo "$RES" | jq -r .bot)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$RES" | jq -e .ok > /dev/null

      - name: Перенести склад з командних табличок (один раз)
        if: hashFiles('worker/seed/members.enc') != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          jq -n --rawfile enc "$GITHUB_WORKSPACE/worker/seed/members.enc" '{enc: ($enc | rtrimstr("\n"))}' > body.json
          RES=$(curl -s -X POST "$URL/admin/members" -H "x-sync-key: $SYNC_KEY" -H "content-type: application/json" --data @body.json)
          echo "$RES" | jq '{ok, skipped, totals, missingAreas, teams: [.teams[]? | {area, team, matched, created, added, linked, dup, bad}]}'
          echo "$RES" | jq -e .ok > /dev/null

      - name: Обʼєднати команди з YL Pray з наявними (один раз)
        if: hashFiles('worker/seed/prayfix.json') != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 20
          RES=$(curl -s -X POST "$URL/admin/prayFix" -H "x-sync-key: $SYNC_KEY" -H "content-type: application/json" --data @"$GITHUB_WORKSPACE/worker/seed/prayfix.json")
          echo "$RES" | jq '{ok, error, teams}'
          echo "$RES" | jq -e .ok > /dev/null

      - name: Обʼєднати команди й перевірити дублі (один раз)
        if: hashFiles('worker/seed/teams.json') != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 20
          RES=$(curl -s -X POST "$URL/admin/teams" -H "x-sync-key: $SYNC_KEY" -H "content-type: application/json" --data @"$GITHUB_WORKSPACE/worker/seed/teams.json")
          echo "$RES" | jq '{ok, error, merged}'
          echo "AUDIT_ENC $(echo "$RES" | jq -r '.audit // empty')"
          echo "$RES" | jq -e .ok > /dev/null

      - name: Перенести людей з альбому YL Pray (один раз)
        if: hashFiles('worker/seed/pray.enc') != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 20
          jq -n --rawfile enc "$GITHUB_WORKSPACE/worker/seed/pray.enc" '{enc: ($enc | rtrimstr("\n"))}' > body.json
          RES=$(curl -s -X POST "$URL/admin/pray" -H "x-sync-key: $SYNC_KEY" -H "content-type: application/json" --data @body.json)
          echo "$RES" | jq '{ok, skipped, error, rows, people, roles, fields, teamsCreated, missing, linkedByTg}'
          echo "$RES" | jq -e .ok > /dev/null

      - name: Перенести історію з командних табличок (один раз)
        if: hashFiles('worker/seed/history.enc') != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          sleep 20
          i=0; n=1
          while [ "$i" -lt "$n" ]; do
            jq -n --rawfile enc "$GITHUB_WORKSPACE/worker/seed/history.enc" --argjson i "$i" '{enc: ($enc | rtrimstr("\n")), index: $i}' > body.json
            RES=$(curl -s -X POST "$URL/admin/history" -H "x-sync-key: $SYNC_KEY" -H "content-type: application/json" --data @body.json)
            echo "$RES" | jq -c '{team, matched, skipped, missing, club, mg, kr, known, fin, unknownAuthors, error}'
            echo "$RES" | jq -e .ok > /dev/null || exit 1
            n=$(echo "$RES" | jq -r '.n // 0'); i=$((i+1))
          done
